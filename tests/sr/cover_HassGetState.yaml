language: sr
tests:
  - sentences:
      - "Да ли је завеса лева навучена?"
      - "Да ли је лева завеса навучена?"
      - "Да ли је лева завеса затворена?"
    intent:
      name: HassGetState
      slots:
        domain: cover
        name: "Curtain Left"
        state: "closed"
    response: "Не, отворена је"

  - sentences:
